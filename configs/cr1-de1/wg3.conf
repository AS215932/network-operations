; /usr/local/etc/wireguard/wg3.conf — cr1.de1 wg3 -> rtr-bsd.ovh1 wg1 (issue #14)
; Listens 1343 (first free port on de1: 1337/1338/1342 taken).
; Overlay link 2a0c:b641:b50:ff11::/127 (de1 ::0, rtr-bsd ::1).
; Fill keys at build time; rtr-bsd endpoint is its distinct OVH underlay.
[Interface]
ListenPort = 1343
PrivateKey = <PRIVATE_KEY>

[Peer]
; rtr-bsd.ovh1 (OVH underlay endpoint)
PublicKey = <RTR_BSD_WG1_PUBLIC_KEY>
Endpoint = [2001:41d0:303:48a::3]:1344
AllowedIPs = ::/0
PersistentKeepalive = 30
