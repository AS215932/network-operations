! /usr/local/etc/frr/frr.conf — rtr-bsd.ovh1 (OpenBSD + FRRouting, NO VRF)
! Parallel edge router for issue #14. Same dom0, same xenbr attachment as rtr,
! distinct addresses (infra ::2, vm b51::2, loopback ::e, underlay 48a::3) so it
! runs alongside live rtr without conflicts.
!
! Routing daemon decision (issue #14): FRR, not OpenBGPD/OpenOSPFD. The fleet
! (rtr, cr1-*) is FRR-only and the IaC contracts pin FRR syntax (route-maps,
! prefix-lists, as-path filters, soft-reconfig); a second BGP dialect doubles
! review cost for zero forwarding benefit. The VRF/systemd-networkd/Jool pain
! being solved lives below FRR, not in it. OpenBSD carries FRR as a package;
! interface addresses below are assigned by FRR (zebra), same as the FreeBSD
! cores — fall back to /etc/hostname.xnf* if the port ever regresses.
!
! Phase 1 (this file): v6 routing parity with rtr — iBGP full mesh as the 5th
! router, OSPF6 on the three core links, same originated networks and the same
! ch1 > nl1 > de1 egress ladder. NO failover IPv4, NO DNAT, NO NAT64: the
! stateful v4 services stay on rtr until the atomic cutover (docs/runbooks/
! rtr-bsd-build.md). rtr-bsd must therefore never win transit traffic in
! Phase 1 — it originates the same aggregates (drop-in readiness), and the
! cores' best-path choice keeps production on rtr until the cutover moves
! the gateway/DNAT/NAT64 addresses.
frr version 10.6.0
frr defaults traditional
hostname rtr-bsd
log syslog informational
service integrated-vtysh-config
!
ipv6 prefix-list AS215932v6-out seq 5 permit 2a0c:b641:b50::/44
ipv6 prefix-list LOOPBACK-ONLY seq 5 permit 2a0c:b641:b50::e/128
!
! Blackhole aggregate for BGP announcement
ipv6 route 2a0c:b641:b50::/44 blackhole
! VPN client subnet → vpn VM over the dedicated transit (PR #586).
! Next-hop follows peers.vpn.ipv6; rtr and rtr-bsd must agree or return
! traffic splits between the two edge routers (both originate 3::/64).
ipv6 route 2a0c:b641:b50:3::/64 2a0c:b641:b50:1::60
! loop Docker container subnet
ipv6 route 2a0c:b641:b50:f0::/64 2a0c:b641:b50:2::f0
! ci-pr Docker container subnet
ipv6 route 2a0c:b641:b51:c1::/64 2a0c:b641:b51::c1
exit
!
! xnf0 mgmt: link-local only, no overlay address (underlay SSH only).
! xnf1 infra: standby gateway address. ::1 stays on rtr until cutover;
!   ::2 is provable as a gateway from day one (point a test VM at it).
interface xnf1
 ipv6 address 2a0c:b641:b50:2::2/64
exit
!
! xnf2 vm/customer: standby customer aggregate address. b51::1 stays on rtr
!   until cutover; b51::2 lets burn-in VMs route via rtr-bsd explicitly.
interface xnf2
 ipv6 address 2a0c:b641:b51::2/48
exit
!
interface lo0
 ipv6 address 2a0c:b641:b50::e/128
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
exit
!
! wg0 → cr1-nl1 (link ff10::/127)
interface wg0
 ipv6 address 2a0c:b641:b50:ff10::1/127
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
! wg1 → cr1-de1 (link ff11::/127)
interface wg1
 ipv6 address 2a0c:b641:b50:ff11::1/127
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
! wg2 → cr1-ch1 (link ff12::/127)
interface wg2
 ipv6 address 2a0c:b641:b50:ff12::1/127
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
router bgp 215932
 bgp router-id 0.0.0.14
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 !
 ! iBGP mesh — 5th router. update-source is the distinct ::e loopback.
 neighbor 2a0c:b641:b50::a remote-as 215932
 neighbor 2a0c:b641:b50::a description cr1.nl1
 neighbor 2a0c:b641:b50::a update-source 2a0c:b641:b50::e
 neighbor 2a0c:b641:b50::b remote-as 215932
 neighbor 2a0c:b641:b50::b description cr1.de1
 neighbor 2a0c:b641:b50::b update-source 2a0c:b641:b50::e
 neighbor 2a0c:b641:b50::c remote-as 215932
 neighbor 2a0c:b641:b50::c description cr1.ch1
 neighbor 2a0c:b641:b50::c update-source 2a0c:b641:b50::e
 neighbor 2a0c:b641:b50::d remote-as 215932
 neighbor 2a0c:b641:b50::d description rtr.ovh1
 neighbor 2a0c:b641:b50::d update-source 2a0c:b641:b50::e
 !
 address-family ipv6 unicast
  ! Same originated set as rtr — drop-in ready at cutover.
  network 2a0c:b641:b50::/44
  network 2a0c:b641:b50:2::/64
  network 2a0c:b641:b50:3::/64
  network 2a0c:b641:b50:f0::/64
  ! Infra /48 — originated so cr1-ch1 can export it as a more-specific and pull
  ! return traffic onto the CH path. Covered by the ::/44 blackhole above; with
  ! `no bgp network import-check` it originates unconditionally.
  network 2a0c:b641:b50::/48
  network 2a0c:b641:b51::/48
  ! iBGP peers — no transit filters, but per-core local-pref so egress is
  ! deterministic instead of tie-broken. MUST mirror rtr's ladder: rtr-bsd is
  ! equally transit-free, and a divergent ladder would flap egress preference
  ! between the two edge routers during parallel operation (see docs/bgp-policy.md).
  neighbor 2a0c:b641:b50::a activate
  neighbor 2a0c:b641:b50::a next-hop-self
  neighbor 2a0c:b641:b50::a soft-reconfiguration inbound
  neighbor 2a0c:b641:b50::a route-map IBGP-NL1-IN in
  neighbor 2a0c:b641:b50::b activate
  neighbor 2a0c:b641:b50::b next-hop-self
  neighbor 2a0c:b641:b50::b soft-reconfiguration inbound
  neighbor 2a0c:b641:b50::b route-map IBGP-DE1-IN in
  neighbor 2a0c:b641:b50::c activate
  neighbor 2a0c:b641:b50::c next-hop-self
  neighbor 2a0c:b641:b50::c soft-reconfiguration inbound
  neighbor 2a0c:b641:b50::c route-map IBGP-CH1-IN in
  neighbor 2a0c:b641:b50::d activate
  neighbor 2a0c:b641:b50::d next-hop-self
  neighbor 2a0c:b641:b50::d soft-reconfiguration inbound
 exit-address-family
exit
!
router ospf6
 ospf6 router-id 0.0.0.14
exit
!
! --- Transit AS-path filter (combined; identical to rtr/cr1-*) ---
! Deny own ASN (loop prevention)
bgp as-path access-list 1 seq 5 deny _215932_
! Deny private 16-bit ASNs (64512-65535)
bgp as-path access-list 1 seq 10 deny _64[5-9][0-9]{2}_
bgp as-path access-list 1 seq 15 deny _65[0-4][0-9]{2}_
bgp as-path access-list 1 seq 20 deny _655[0-2][0-9]_
bgp as-path access-list 1 seq 25 deny _6553[0-5]_
! Deny private 32-bit ASNs (4200000000-4294967295)
bgp as-path access-list 1 seq 30 deny _[1-3][0-9]{10}_
bgp as-path access-list 1 seq 35 deny _4[01][0-9]{9}_
bgp as-path access-list 1 seq 40 deny _42[0-8][0-9]{8}_
bgp as-path access-list 1 seq 45 deny _429[0-3][0-9]{7}_
bgp as-path access-list 1 seq 50 deny _4294[0-8][0-9]{6}_
bgp as-path access-list 1 seq 55 deny _42949[0-5][0-9]{5}_
bgp as-path access-list 1 seq 60 deny _429496[0-6][0-9]{4}_
bgp as-path access-list 1 seq 65 deny _4294967[01][0-9]{3}_
bgp as-path access-list 1 seq 70 deny _42949672[0-8][0-9]_
bgp as-path access-list 1 seq 75 deny _429496729[0-5]_
! Permit routes with reasonable path length (implicit deny for longer)
bgp as-path access-list 1 seq 100 permit ^.{0,200}$
!
route-map TRANSIT-IN permit 10
 match as-path 1
exit
!
route-map TRANSIT-OUT permit 10
 match ipv6 address prefix-list AS215932v6-out
exit
!
! --- Egress core preference (MUST mirror rtr) ---
! rtr-bsd is transit-free like rtr: every packet leaving the OVH estate exits
! through one of the three cores. Pin the same order (ch1 200 > nl1 90 > de1 80)
! so the two edge routers agree during parallel operation. Failover is
! automatic: lose ch1 and nl1 (90) wins, lose both and de1 (80) wins.
route-map IBGP-CH1-IN permit 10
 set local-preference 200
exit
!
route-map IBGP-NL1-IN permit 10
 set local-preference 90
exit
!
route-map IBGP-DE1-IN permit 10
 set local-preference 80
exit
!
