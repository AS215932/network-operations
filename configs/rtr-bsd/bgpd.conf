# /etc/bgpd.conf — rtr-bsd.ovh1 (OpenBSD base bgpd), issue #14.
# Replaces configs/rtr-bsd/frr.conf (FRR is not packaged for OpenBSD 7.8;
# decision 2026-10-14). Policy is a 1:1 translation of the FRR config:
#   - iBGP full mesh as 5th router, update-source ::e, next-hop-self
#   - same originated set as rtr (drop-in ready at cutover)
#   - egress ladder mirrors rtr: ch1 200 > nl1 90 > de1 80, rtr unchanged
#   - transit-free: no eBGP neighbors; only AS215932 prefixes announced
# Burn-in safety (Phase 2): every neighbor starts `down`, and everything we
# announce carries localpref 50 / MED 500, below rtr's default 100, so the
# cores and rtr never prefer rtr-bsd paths over rtr. Remove both at cutover.
# soft-reconfiguration inbound: bgpd keeps Adj-RIB-In by default.

AS 215932
router-id 0.0.0.14
fib-update yes

prefix-set AS215932v6-out { 2a0c:b641:b50::/44 or-longer }
prefix-set LOOPBACK-ONLY  { 2a0c:b641:b50::e/128 }

# Originated unconditionally (FRR: no bgp network import-check). The /44 is
# backed by the blackhole route in /etc/hostname.lo0.
network 2a0c:b641:b50::/44
network 2a0c:b641:b50:2::/64
network 2a0c:b641:b50:3::/64
network 2a0c:b641:b50:f0::/64
network 2a0c:b641:b50::/48
network 2a0c:b641:b51::/48

group "ibgp" {
	remote-as 215932
	local-address 2a0c:b641:b50::e
	announce IPv4 none
	announce IPv6 unicast
	set nexthop self
	down
	neighbor 2a0c:b641:b50::a { descr "cr1.nl1" }
	neighbor 2a0c:b641:b50::b { descr "cr1.de1" }
	neighbor 2a0c:b641:b50::c { descr "cr1.ch1" }
	neighbor 2a0c:b641:b50::d { descr "rtr.ovh1" }
}

# --- Outbound: transit-free, own space only, burn-in de-preference ---
deny  to group "ibgp"
allow to group "ibgp" prefix-set AS215932v6-out set { localpref 50 med 500 }

# --- Inbound: transit AS-path filter (identical intent to rtr/cr1-*) ---
allow from group "ibgp"
deny quick from group "ibgp" AS 215932
deny quick from group "ibgp" AS 64512 - 65535
deny quick from group "ibgp" AS 4200000000 - 4294967295
deny quick from group "ibgp" max-as-len 200

# --- Egress core preference (MUST mirror rtr) ---
match from 2a0c:b641:b50::c set localpref 200
match from 2a0c:b641:b50::a set localpref 90
match from 2a0c:b641:b50::b set localpref 80
