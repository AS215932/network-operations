; rtr-bsd wg0 -> cr1.nl1 (new iface on nl1, issue #14)
; rtr-bsd listens 1343; nl1 listens 1343 on its new iface.
; Overlay link 2a0c:b641:b50:ff10::/127 (rtr-bsd ::1, nl1 ::0).
; Fill keys at build time: generate with `wg genkey | tee private.key | wg pubkey`.
[Interface]
ListenPort = 1343
PrivateKey = <PRIVATE_KEY>

[Peer]
; cr1.nl1 (underlay endpoint)
PublicKey = <CR1_NL1_WG5_PUBLIC_KEY>
Endpoint = [2a0c:b640:8:69::1]:1343
AllowedIPs = ::/0
PersistentKeepalive = 30
