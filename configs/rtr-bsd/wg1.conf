; rtr-bsd wg1 -> cr1.de1 (new iface on de1, issue #14)
; rtr-bsd listens 1344; de1 listens 1343 on its new iface.
; Overlay link 2a0c:b641:b50:ff11::/127 (rtr-bsd ::1, de1 ::0).
; Fill keys at build time: generate with `wg genkey | tee private.key | wg pubkey`.
[Interface]
ListenPort = 1344
PrivateKey = <PRIVATE_KEY>

[Peer]
; cr1.de1 (underlay endpoint)
PublicKey = <CR1_DE1_WG3_PUBLIC_KEY>
Endpoint = [2a0c:b640:10::213]:1343
AllowedIPs = ::/0
PersistentKeepalive = 30
