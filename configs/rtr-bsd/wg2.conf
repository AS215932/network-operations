; rtr-bsd wg2 -> cr1.ch1 (new iface on ch1, issue #14)
; rtr-bsd listens 1345; ch1 listens 1343 on its new iface.
; Overlay link 2a0c:b641:b50:ff12::/127 (rtr-bsd ::1, ch1 ::0).
; Fill keys at build time: generate with `wg genkey | tee private.key | wg pubkey`.
[Interface]
ListenPort = 1345
PrivateKey = <PRIVATE_KEY>

[Peer]
; cr1.ch1 (underlay endpoint)
PublicKey = <CR1_CH1_WG3_PUBLIC_KEY>
Endpoint = [2a09:4c0:100:2d88::8898]:1343
AllowedIPs = ::/0
PersistentKeepalive = 30
