# /etc/ospf6d.conf — rtr-bsd.ovh1 (OpenBSD base ospf6d), issue #14.
# Translation of the FRR `router ospf6` + interface stanzas: area 0 on the
# three core WG links (point-to-point), lo0 passive so only the ::e loopback
# (LOOPBACK-ONLY) is advertised. No redistribution.
router-id 0.0.0.14
fib-update yes

area 0.0.0.0 {
	interface lo0 { passive }
	interface wg0 { type p2p }
	interface wg1 { type p2p }
	interface wg2 { type p2p }
}
