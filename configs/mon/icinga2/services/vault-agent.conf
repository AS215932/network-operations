// /etc/icinga2/conf.d/services/vault-agent.conf — Vault Agent secret delivery
// health, one service per agent per host.
//
// Closes the blind spot behind the 2026-07-18 → 2026-07-25 hyrule-cloud secrets
// outage: vault-agent-hyrule-cloud on `api` failed every AppRole login with 403
// for a week while systemd reported the unit `active (running)`, so no existing
// check (ping6, node-up, prom_systemd_unit, hyrule-cloud /health) noticed that
// /opt/hyrule-cloud/.env had been frozen since 18 July and that every
// `vault kv patch` since then had never reached the application.
//
// Data path: ansible/roles/vault_agent installs vault-agent-health-metrics.timer
// on the host, which publishes vault_agent_* metrics through node_exporter's
// textfile collector; Prometheus on mon scrapes them; this check evaluates them.
// No SSH and no remote plugin exec — same shape as github-runner.conf.
//
// Opt in per host with `vars.vault_agents` (array of agent names):
//   * legacy static hosts  → configs/mon/icinga2/hosts/infra-vms.conf
//   * ansible-registered   → monitoring_check_vars.vault_agents in host_vars

object CheckCommand "vault_agent_health" {
  command = [ "/etc/icinga2/scripts/check_vault_agent_health.py" ]

  arguments = {
    "--prom-url" = "$vault_agent_prom_url$"
    "--instance" = "$vault_agent_instance$"
    "--agent" = "$vault_agent_name$"
    "--collector-max-age" = "$vault_agent_collector_max_age$"
    "--token-max-age" = "$vault_agent_token_max_age$"
    "--render-max-age" = "$vault_agent_render_max_age$"
    "--ephemeral-state" = "$vault_agent_ephemeral_state$"
  }

  vars.vault_agent_prom_url = "http://localhost:9090"

  // The host collector runs every 5m; 15m of silence means it is broken.
  vars.vault_agent_collector_max_age = "900"

  // The token sink is rewritten on re-authentication, not on renewal, so the
  // threshold must clear the AppRole's token_max_ttl (4h fleet-wide today) with
  // room for one missed cycle. A healthy agent refreshes well inside 6h.
  vars.vault_agent_token_max_age = "21600"

  // Off by default: Vault Agent writes a destination only when the rendered
  // content changes, so a stable secret legitimately keeps an old mtime. Set it
  // per service where the secret is known to rotate on a schedule. A MISSING
  // destination is always CRITICAL regardless of this setting.
  vars.vault_agent_render_max_age = "0"

  // A consumed single-use SecretID means the agent is running on a credential
  // it can never re-read: it works until the next restart, then 403s forever.
  // WARNING rather than CRITICAL because nothing is broken yet — it is the
  // early warning the July outage did not have. Set to "ok" per host only if
  // an operator is deliberately keeping that agent in wrapped mode.
  vars.vault_agent_ephemeral_state = "warning"
}

apply Service "vault-agent " for (agent in host.vars.vault_agents) {
  check_command = "vault_agent_health"
  check_interval = 5m
  retry_interval = 2m
  // Two consecutive failures before HARD: the collector and the scrape are both
  // periodic, so a single sample can straddle a legitimate restart.
  max_check_attempts = 3

  notes = "Vault Agent secret delivery (auth + rendered files) — fix: docs/runbooks/vault-agent-durable-auth.md"

  vars.vault_agent_instance = host.vars.prom_instance_node
  vars.vault_agent_name = agent

  // Per-host escape hatches (host_vars -> monitoring_check_vars, or the static
  // host object). Left unset, the CheckCommand defaults above apply.
  if (host.vars.vault_agent_ephemeral_state) {
    vars.vault_agent_ephemeral_state = host.vars.vault_agent_ephemeral_state
  }
  if (host.vars.vault_agent_token_max_age) {
    vars.vault_agent_token_max_age = host.vars.vault_agent_token_max_age
  }
  if (host.vars.vault_agent_render_max_age) {
    vars.vault_agent_render_max_age = host.vars.vault_agent_render_max_age
  }

  assign where host.vars.vault_agents && host.vars.prom_instance_node
}
