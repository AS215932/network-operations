// This check runs on mon and uses Icinga's independent Discord path.
// It must remain independent when ordinary incident routing moves to NOC.
object CheckCommand "noc_agent_delivery_health" {
  command = [ "/etc/icinga2/scripts/check_noc_agent_delivery_health.py" ]
  timeout = 15s
  arguments = {
    "host" = { skip_key = true; order = 1; value = "$noc_delivery_host$" }
    "port" = { skip_key = true; order = 2; value = "$noc_delivery_port$" }
  }
}
