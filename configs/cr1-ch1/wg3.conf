; /usr/local/etc/wireguard/wg3.conf — cr1.ch1 wg3 -> rtr-bsd.ovh1 wg2 (issue #14)
; Listens 1343 (first free port on ch1: 1339/1341/1342 taken).
; Overlay link 2a0c:b641:b50:ff12::/127 (ch1 ::0, rtr-bsd ::1).
; Fill keys at build time; rtr-bsd endpoint is its distinct OVH underlay.
[Interface]
ListenPort = 1343
PrivateKey = <PRIVATE_KEY>

[Peer]
; rtr-bsd.ovh1 (OVH underlay endpoint)
PublicKey = 37a3nKiUhKR+9UzylAASKKzbu5FQS+JzGzTlPdugr30=
Endpoint = [2001:41d0:303:48a::3]:1345
AllowedIPs = ::/0
PersistentKeepalive = 30
