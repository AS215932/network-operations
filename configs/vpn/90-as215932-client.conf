# NetworkManager's per-device connectivity probe is incompatible with the
# IPv4 fail-closed policy used by the AS215932 WireGuard client. When the
# probe is blackholed, NetworkManager adds 20000 to the underlay route metric;
# that can strand the WireGuard IPv4 endpoint and take down the tunnel.
#
# Disable the probe rather than allowing its IPv4 traffic to bypass the VPN.
[connectivity]
enabled=false
