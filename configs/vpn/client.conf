# WireGuard transport config — laptop → AS215932 VPN
#
# Overlay is IPv6-only. Public Google DNS64 synthesizes 64:ff9b::/96, matching
# Jool NAT64 on rtr. A resolver on the vpn VM should replace public DNS64 later.
#
# AllowedIPs is IPv6 only. 0.0.0.0/0 is not a null route and must not appear
# here: it means "send IPv4 to this peer", but this peer accepts no IPv4.
# NetworkManager clients must use the native blackhole route and routing rule
# in configs/vpn/README.md to prevent IPv4 leaks. Its optional connectivity
# probe must also be disabled so it does not penalize the underlay route.
#
# The transport endpoint is the vpn VM's globally routed IPv6 address.
# NetworkManager's IPv6 auto-default-route handling keeps its marked outer
# packets on the underlay, while every IPv4 destination remains blackholed.
[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 2a0c:b641:b50:3::2/128
DNS = 2001:4860:4860::64, 2001:4860:4860::6464
FwMark = 0x51820

[Peer]
PublicKey = h4AjH9BV72VJEZhiUMZANfIdrzKxX1NQ8JaBJYFH71U=
Endpoint = [2a0c:b641:b50:2::60]:51820
AllowedIPs = ::/0
PersistentKeepalive = 25
