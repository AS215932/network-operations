# WireGuard client config — laptop → AS215932 VPN
#
# Overlay is IPv6-only. Recursion is public DNS64 (Google), not rtr Unbound —
# keep the vpn VM's DNS separate from the overlay resolver. Synthesized AAAA
# use 64:ff9b::/96, which matches Jool NAT64 on rtr. A resolver on the vpn box
# itself is the longer-term split.
#
# Do NOT put the overlay IPv6 endpoint in a ::/0 tunnel. The VPN server
# (`2a0c:b641:b50:2::60`) lives inside our prefix; without an fwmark exemption
# the handshake is swallowed by the tunnel and the machine has no internet.
# Handshake over the public IPv4 DNAT instead — that address is outside ::/0
# but inside 0.0.0.0/0, so the client MUST set an fwmark (wg-quick does this
# automatically when AllowedIPs contains a default; NM needs it explicit).
#
# 0.0.0.0/0 with no IPv4 address on the tunnel null-routes IPv4. That is
# intentional: IPv4 must not leak to the local ISP. IPv4-only names go out
# as DNS64 AAAA via Jool. Happy Eyeballs IPv4 sockets are supposed to fail.
#
# IPv6 endpoint (only if the client stack installs an fwmark / endpoint route):
#   Endpoint = [2a0c:b641:b50:2::60]:51820
[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 2a0c:b641:b50:3::2/128
DNS = 2001:4860:4860::64, 2001:4860:4860::6464
FwMark = 0x51820

[Peer]
PublicKey = h4AjH9BV72VJEZhiUMZANfIdrzKxX1NQ8JaBJYFH71U=
Endpoint = 46.105.40.223:51820
AllowedIPs = ::/0, 0.0.0.0/0
PersistentKeepalive = 25
