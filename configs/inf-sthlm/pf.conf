# inf-sthlm pf: IPv6-only service, 443 reachable only from Cloudflare.
ext_if = "vio0"
wg_if  = "wg0"
gpu_net = "2a0c:b641:b50:10::/64"
wg_port = "51820"

table <cloudflare6> persist file "/etc/pf.cloudflare6"
table <mgmt6> const { 2a0c:b641:b50:2::/64, 2a0c:b641:b50:3::/64 }

set skip on lo
set block-policy drop
block log all

pass out quick keep state

# Underlay: GPU nodes (vast.ai, IPv4 behind NAT) dial the v4 WireGuard endpoint.
pass in on $ext_if inet proto udp to port $wg_port
pass in on $ext_if inet6 proto udp to port $wg_port

# Public API: HTTPS only from Cloudflare IPv6 (AOP enforces the client cert too).
pass in on $ext_if inet6 proto tcp from <cloudflare6> to port 443

# Management SSH from infra / VPN operators only.
pass in on $ext_if inet6 proto tcp from <mgmt6> to port 22

# GPU overlay: nodes may only answer; proxy initiates to vLLM :8000.
block in quick on $wg_if from $gpu_net to $gpu_net
pass out on $wg_if inet6 proto tcp to $gpu_net port 8000

pass in inet6 proto ipv6-icmp
pass in inet proto icmp icmp-type echoreq
