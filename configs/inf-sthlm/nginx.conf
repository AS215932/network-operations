# inf-sthlm: OpenAI-compatible inference reverse proxy (IPv6-only).
# Clients -> Cloudflare (v4+v6) -> AAAA origin :443 (pf: Cloudflare v6 only)
# -> vLLM backends over wg-gpu (inner IPv6 2a0c:b641:b50:10::/64).
worker_processes auto;

events { worker_connections 4096; }

http {
    include       mime.types;
    default_type  application/json;
    server_tokens off;

    # Real client IP from Cloudflare (same list as pf table <cloudflare6>).
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    log_format infer '$remote_addr [$time_iso8601] "$request" $status '
                     '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                     'up=$upstream_addr cf_ray=$http_cf_ray';
    access_log /var/www/logs/infer.access.log infer;

    # vLLM (Qwen3.8-27B FP8, H100 SXM) over WireGuard. Node addresses are
    # ::1x in 2a0c:b641:b50:10::/64; add one line per GPU node.
    upstream vllm {
        least_conn;
        server [2a0c:b641:b50:10::11]:8000 max_fails=2 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen [::]:443 ssl ipv6only=on;   # no IPv4 listener
        http2 on;
        server_name infer.as215932.net;

        # Cloudflare Origin CA certificate (placeholder paths).
        ssl_certificate     /etc/ssl/inf-sthlm-origin.crt;
        ssl_certificate_key /etc/ssl/private/inf-sthlm-origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cloudflare Authenticated Origin Pulls: only Cloudflare's client cert passes.
        ssl_client_certificate /etc/ssl/cloudflare-origin-pull-ca.pem;
        ssl_verify_client on;

        client_max_body_size 8m;

        location = /v1/chat/completions {
            limit_except POST { deny all; }
            proxy_pass http://vllm;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # x402 payment headers pass through untouched to the x402 layer.
            proxy_pass_request_headers on;

            # SSE streaming: no buffering, long timeouts.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no always;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location = /v1/models {
            limit_except GET { deny all; }
            proxy_pass http://vllm;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / { return 404 '{"error":"not found"}'; }
    }
}
