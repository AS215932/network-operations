; /usr/local/etc/wireguard/wg5.conf — cr1.nl1 wg5 -> rtr-bsd.ovh1 wg0 (issue #14)
; Listens 1343 (first free port on nl1: 1337/1338/1340/1341 taken).
; Overlay link 2a0c:b641:b50:ff10::/127 (nl1 ::0, rtr-bsd ::1).
; Fill keys at build time; rtr-bsd endpoint is its distinct OVH underlay.
[Interface]
ListenPort = 1343
PrivateKey = <PRIVATE_KEY>

[Peer]
; rtr-bsd.ovh1 (OVH underlay endpoint)
PublicKey = ijl7XzmEd6cwNRYjnrd69QJHFTOcj5VQrClWRz9EWCc=
Endpoint = [2001:41d0:303:48a::3]:1343
AllowedIPs = ::/0
PersistentKeepalive = 30
