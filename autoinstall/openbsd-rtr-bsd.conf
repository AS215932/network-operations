# OpenBSD autoinstall response file for the rtr-bsd VM (issue #14).
#
# Serve as install.conf from dom0 during installation. OpenBSD NICs on Xen are
# xnf0/xnf1/... in VIF-device order — attach VIFs in this order:
#   device 0 → xenbr-mgmt   (xnf0, link-local only)
#   device 1 → xenbr-infra  (xnf1, 2a0c:b641:b50:2::2/64, gw ::1 = live rtr)
#   device 2 → xenbr-vm     (xnf2, unconfigured at install; FRR assigns b51::2)
#   device 3 → xenbr0/wan   (xnf3, unconfigured at install; set post-install)
#
# Only xnf0/xnf1 are configured by the installer (management + a routed infra
# address so the VM is reachable for Ansible from minute one). xnf2/xnf3 are
# left `done` and configured post-install via /etc/hostname.xnf* (see
# docs/runbooks/rtr-bsd-build.md). The infra gateway is the LIVE rtr (::1):
# rtr-bsd must not steal gateway duties during burn-in.

System hostname = rtr-bsd
Which network interface do you wish to configure = xnf0
IPv4 address for xnf0 = none
IPv6 address for xnf0 = autoconf
Which network interface do you wish to configure = xnf1
IPv4 address for xnf1 = none
IPv6 address for xnf1 = 2a0c:b641:b50:2::2
IPv6 prefix length for xnf1 = 64
IPv6 default router for xnf1 = 2a0c:b641:b50:2::1
Which network interface do you wish to configure = done
DNS domain name = as215932.net
DNS nameservers = 2a0c:b641:b50:2::1
Password for root account = {{ root_password }}
Public ssh key for root account = {{ ssh_pubkey }}
Start sshd(8) by default = yes
Do you expect to run the X Window System = no
Setup a user = svag
Full name for user svag = svag
Password for user svag = {{ user_password }}
Public ssh key for user svag = {{ ssh_pubkey }}
Allow root ssh login = prohibit-password
What timezone are you in = UTC
Which disk is the root disk = sd0
Use (W)hole disk MBR, whole disk (G)PT, or (E)dit = whole
Use (A)uto layout, (E)dit auto layout, or create (C)ustom layout = auto
Location of sets = cd0
Set name(s) = -game*.tgz -x*.tgz
Directory does not contain SHA256.sig. Continue without verification = yes
Continue without verification = yes
Location of sets = done
