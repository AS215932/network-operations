---
vault_agent_name: noc-agent
# Direct internal IPv6 over the plain-HTTP Vault listener. The public hostname
# stays for external consumers (CI, ops workstation); infra-side renewals bypass
# Caddy so a proxy outage does not break the secrets plane.
vault_agent_vault_addr: "http://[{{ peers.vault.ipv6 }}]:8200"
vault_agent_vault_tls_skip_verify: false
vault_agent_service_group: root
vault_agent_config_dir: "/etc/vault-agent.d"
vault_agent_run_dir: "/run/vault-agent"
vault_agent_run_dir_group: root
vault_agent_run_dir_mode: "0750"
vault_agent_role_id: ""
vault_agent_secret_id: ""
vault_agent_secret_id_response_wrapping_path: ""

# --- AppRole credential durability (incident 2026-07-18 → 2026-07-25) ---
#
# This role supports two auth shapes:
#
#   durable  — vault_agent_secret_id holds a plain, long-lived SecretID and
#              vault_agent_secret_id_response_wrapping_path is empty. The role
#              writes the SecretID 0600 to disk and the agent config sets
#              remove_secret_id_file_after_reading = false, so the credential
#              survives reboots, package upgrades, OOM kills and deploys.
#              REQUIRES the AppRole to be created with secret_id_num_uses=0 and
#              secret_id_ttl=0, and — because a SecretID at rest is weaker than
#              a wrapped one — bound to the consuming host with
#              secret_id_bound_cidrs / token_bound_cidrs.
#
#   wrapped  — vault_agent_secret_id holds a response-wrapping token and
#              vault_agent_secret_id_response_wrapping_path names its creation
#              path. Vault Agent unwraps it once and DELETES the file
#              (remove_secret_id_file_after_reading = true). Stronger at rest,
#              but the credential is single-use: the next restart of the agent
#              has nothing to authenticate with and the agent enters a
#              permanent 403 backoff loop. Only use it where an operator is
#              on hand to re-bootstrap after every restart.
#
# Set true on consumers that must never lose their credential on restart. It
# forces the durable shape even if a stale wrapping path is still deployed in
# the host's .hcl, and refuses a response-wrapping token passed as a plain
# SecretID. Default false keeps every existing caller on its current shape.
vault_agent_require_durable_secret_id: false

# In wrapped mode a running agent consumes the wrapping token the instant the
# file appears (it is in a retry loop), so a subsequent `systemctl restart`
# finds a spent token: "wrapping token is not valid or does not exist". Stop
# the agent before installing the new credential so the unwrap happens exactly
# once, on the start the role performs afterwards.
vault_agent_stop_before_wrapped_secret_id_install: true
vault_agent_role_id_file: "{{ vault_agent_config_dir }}/{{ vault_agent_name }}-role-id"
vault_agent_secret_id_file: "{{ vault_agent_config_dir }}/{{ vault_agent_name }}-secret-id"
vault_agent_token_sink: "{{ vault_agent_run_dir }}/{{ vault_agent_name }}.token"
vault_agent_token_sink_group: root
vault_agent_token_sink_mode: "0600"
vault_agent_template_dir: "{{ vault_agent_config_dir }}/templates"
vault_agent_env_destination: /opt/noc-agent/.env
vault_agent_google_subject_token_destination: /run/noc-agent/google-subject.jwt
vault_agent_noc_github_app_key_destination: /etc/noc-agent/github-app.pem
# Backward-compat alias: callers that set vault_agent_reload_command still work —
# both per-template commands fall back to it. New callers should set the
# per-template variant directly.
vault_agent_reload_command: /bin/systemctl try-restart noc-agent.service
# Env-template reload runs whenever Vault re-renders /opt/noc-agent/.env.
# Defaults to vault_agent_reload_command for backward compat.
vault_agent_env_reload_command: "{{ vault_agent_reload_command }}"
# JWT-template reload runs whenever Vault re-renders the WIF subject token.
# Defaults to /bin/true because Google's identity_pool.Credentials re-reads
# the source credential file on every STS exchange — no consumer restart needed.
# Issue #26: prior to this default, vault-agent restarted noc-agent every
# ~4-5 min on JWT renewal (TTL 45 min, renew at 10% remaining).
vault_agent_jwt_reload_command: /bin/true
vault_agent_hashicorp_repo_url: "https://apt.releases.hashicorp.com"
vault_agent_hashicorp_gpg_url: "https://apt.releases.hashicorp.com/gpg"
# Verified official package key, 2026-09-07. Rotate URL/checksum together; see
# docs/runbooks/package-signing-keys.md. Matching installed keys need no network.
vault_agent_hashicorp_gpg_checksum: sha256:cafb01beac341bf2a9ba89793e6dd2468110291adfbb6c62ed11a0cde6c09029

# Secret templates Vault Agent renders. Each entry: src (Jinja2 template in
# this role's templates/), name (ctmpl filename written into the template
# dir), destination (final rendered file), group (chgrp target on the
# destination), optional mode (default 0640), reload_command (run after each
# render). The default pair
# reproduces the noc-agent behaviour exactly; other consumers — e.g.
# github_runner — pass their own list.
vault_agent_templates:
  - src: noc-agent.env.ctmpl.j2
    name: noc-agent.env.ctmpl
    destination: "{{ vault_agent_env_destination }}"
    group: noc-agent
    reload_command: "{{ vault_agent_env_reload_command }}"
  - src: google-subject.jwt.ctmpl.j2
    name: google-subject.jwt.ctmpl
    destination: "{{ vault_agent_google_subject_token_destination }}"
    group: noc-agent
    # /bin/true by default — JWT re-renders must not bounce the consumer (#26).
    reload_command: "{{ vault_agent_jwt_reload_command }}"
  - src: noc-agent-github-app-key.pem.ctmpl.j2
    name: noc-agent-github-app-key.pem.ctmpl
    destination: "{{ vault_agent_noc_github_app_key_destination }}"
    group: noc-agent
    # noc-agent reads the PEM per handoff, so a re-render must not bounce it.
    reload_command: "{{ vault_agent_jwt_reload_command }}"

# Extra directories the consumer needs created beyond the Vault Agent
# config/run/template dirs. Default = noc-agent's runtime dirs.
vault_agent_extra_dirs:
  - { path: /etc/noc-agent, group: noc-agent, mode: "0750" }
  - { path: /run/noc-agent, group: noc-agent, mode: "0750" }

# --- Health metrics (node_exporter textfile collector) ---
#
# A week of stale secrets went unnoticed in July 2026 because the agent stayed
# `active (running)` while failing every AppRole login, so systemd-state checks
# saw nothing. The collector below stats the token sink, the SecretID file and
# every rendered destination for EVERY agent configured on the host, counts
# recent auth errors in the journal, and publishes the result as Prometheus
# textfile metrics that mon's `vault-agent <name>` Icinga service evaluates
# (configs/mon/icinga2/services/vault-agent.conf).
vault_agent_metrics_enabled: true
vault_agent_metrics_script: /usr/local/sbin/vault-agent-health-metrics
# Derives from the single shared default (group_vars/infra_vms.yml
# node_exporter_textfile_dir) so this can never silently drift from
# monitoring_textfile_dir — node_exporter is pointed at this same directory
# by ansible/roles/monitoring (--collector.textfile.directory). The literal
# fallback only matters outside that inventory (e.g. tests, ad-hoc runs).
vault_agent_metrics_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}"
vault_agent_metrics_interval: 5min
# Journal window scanned for AppRole auth failures. Wider than the interval so
# a burst is never missed between runs.
vault_agent_metrics_auth_error_window: 15min
# An agent that looks down on the first read is re-sampled once after this many
# seconds. `systemctl restart` — which every apply run performs — takes the unit
# through inactive/activating with no token sink, and mon's check re-reads the
# same textfile sample on all three of its attempts, so a single straddled
# sample would be a hard CRITICAL for a full collector interval. Set 0 to
# publish the first read verbatim.
vault_agent_metrics_restart_grace_seconds: 3
