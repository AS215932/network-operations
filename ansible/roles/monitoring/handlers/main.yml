---
- name: restart node_exporter
  systemd:
    name: "{{ monitoring_node_service }}"
    state: restarted
    enabled: true
  when: ansible_os_family == "Debian"

- name: restart node_exporter (OpenBSD)
  command: "rcctl restart {{ monitoring_node_service }}"
  listen: restart node_exporter
  when: ansible_os_family == "OpenBSD"

- name: stop node_exporter before FreeBSD restart
  ansible.builtin.command: "pkill -x {{ monitoring_node_service }}"
  register: monitoring_freebsd_node_exporter_pkill
  changed_when: monitoring_freebsd_node_exporter_pkill.rc == 0
  failed_when: monitoring_freebsd_node_exporter_pkill.rc not in [0, 1]
  listen: restart node_exporter
  when: ansible_os_family == "FreeBSD"

- name: start node_exporter (FreeBSD)
  ansible.builtin.command: "service {{ monitoring_node_service }} onestart"
  changed_when: true
  listen: restart node_exporter
  when: ansible_os_family == "FreeBSD"

# Dashboard JSON changes are picked up by the file provisioner on its own
# interval; datasource provisioning is only read at startup, so this handler is
# what activates those.
# A bad provisioning file makes Grafana exit at startup, and systemd's restart
# limit then latches the unit into failed/start-limit. Without this, the very
# apply that fixes the bad file cannot restart the service ("Start request
# repeated too quickly") and the run reports failure with Grafana still down.
- name: clear grafana start-limit
  command: "systemctl reset-failed {{ monitoring_grafana_service }}"
  changed_when: false
  failed_when: false
  listen: restart grafana

- name: restart grafana service
  systemd:
    name: "{{ monitoring_grafana_service }}"
    state: restarted
    enabled: true
  listen: restart grafana

- name: reload icinga2
  command: icinga2 daemon -C
  changed_when: false
  listen: reload icinga2
  delegate_to: "{{ monitoring_mon_host }}"
  run_once: true

- name: reload icinga2 (apply)
  systemd:
    name: icinga2
    state: reloaded
  listen: reload icinga2
  delegate_to: "{{ monitoring_mon_host }}"
  run_once: true
