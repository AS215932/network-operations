---
# When true: install node_exporter on the host AND register the Host object
# on mon. False = render only.
monitoring_apply: false

# When true: render an Icinga2 Host object for this host on mon.
# Default false because the existing /etc/icinga2/conf.d/hosts/{infra-vms,
# routers,dom0}.conf already covers the original fleet — opt in for new hosts
# (ns2, irc, future). Setting this to true on a host already in those files
# WILL fail icinga2 reload (duplicate Host objects).
monitoring_register: false

# Where to register host objects on mon (kept separate from manually-curated
# /etc/icinga2/conf.d/hosts/{infra-vms,routers,dom0}.conf).
monitoring_icinga_dir: /etc/icinga2/conf.d/hosts/ansible

# The mon host the registration is delegated to.
monitoring_mon_host: mon

# node_exporter listen address. By default we listen on the host's overlay v6
# (so only mon can scrape via the firewall rule), then on its public v6/v4
# for off-net hosts (e.g. ns2).
# Override per-host via host_vars if a different bind is needed.
monitoring_node_listen: ":9100"

# Expose node_systemd_service_restart_total (one extra series per systemd unit)
# so crash/restart loops are visible to Prometheus/Icinga (#92). On by default;
# set false in host_vars on a high-cardinality node to cap scrape cost.
monitoring_node_restart_metrics: true

# Enable node_exporter's textfile collector so on-host agents can publish
# metrics no exporter can derive on its own. Added for the Vault Agent health
# collector (ansible/roles/vault_agent/tasks/metrics.yml), which is the only
# signal that catches an agent that is `active (running)` but failing every
# AppRole login — the July 2026 hyrule-cloud incident. Directory is created by
# whichever role writes into it; node_exporter tolerates it being absent.
monitoring_node_textfile_enabled: true
# Derives from the single shared default (group_vars/infra_vms.yml
# node_exporter_textfile_dir) so this can never silently drift from
# vault_agent_metrics_textfile_dir, which writes into this same directory.
# The literal fallback only matters outside that inventory.
monitoring_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}"

# Disks to monitor. Each key is the Icinga service name suffix; mountpoint is
# read by the prom_disk apply rule on mon. Default = root only.
monitoring_disks:
  "disk /": { mountpoint: "/" }

# Per-host extra service objects. Each entry becomes one `object Service` block
# on mon. Required keys: name, check_command. Optional: vars (dict), interval, retry, notes.
# Hostname and address derive automatically from the host being registered.
monitoring_extra_services: []

# When true, remove mon's by_ssh pubkey from root's authorized_keys after the
# dedicated monitoring user is provisioned. Used for one-way migrations from
# legacy root-based checks (rtr).
monitoring_remove_legacy_root_by_ssh_key: false

# by_ssh known_hosts target on mon. Debian's icinga2 package runs as the
# `nagios` user with HOME=/var/lib/nagios, so OpenSSH reads this file when
# check_by_ssh runs from Icinga.
monitoring_by_ssh_known_hosts_path: /var/lib/nagios/.ssh/known_hosts

# --- Grafana (mon only) -----------------------------------------------------
# Dashboards are provisioned from files in configs/mon/grafana-dashboards/ so a
# rebuilt mon comes back with the same panels. A hand-imported dashboard lives
# only in grafana.db and is invisible to the repo — which is exactly how the
# x402 payments dashboard sat unimported from 2026-07-10 until 2026-07-31
# despite its JSON, scrape job, and alert rules all being live.
monitoring_grafana_service: grafana-server
monitoring_grafana_provisioning_dir: /etc/grafana/provisioning
monitoring_grafana_dashboard_dir: /var/lib/grafana/dashboards
monitoring_grafana_dashboards_repo: "{{ playbook_dir }}/../../configs/mon/grafana-dashboards"

# Grafana file-provisioned dashboards reference datasources by uid, so the uid
# must be config rather than the hash Grafana invents on first start (mon had
# PBFA97CFB590B2093 for Prometheus). Provisioning these files with an explicit
# uid rewrites the existing datasources in place — safe here because nothing
# referenced the old uids, and from now on the dashboard JSON pins these.
monitoring_grafana_prometheus_uid: prometheus
monitoring_grafana_loki_uid: loki
monitoring_grafana_datasources:
  - file: prometheus.yaml
    name: Prometheus
    type: prometheus
    uid: "{{ monitoring_grafana_prometheus_uid }}"
    url: http://localhost:9090
    is_default: true
  - file: loki.yaml
    name: Loki
    type: loki
    uid: "{{ monitoring_grafana_loki_uid }}"
    # Loki's HTTP API on the log VM; firewalled to mon by host_vars/log.yml.
    url: "http://[{{ peers.log.ipv6 }}]:3100"
    is_default: false

# Datasources Grafana created on its own that we want gone. mon shipped with
# example opentsdb/graphite/influxdb entries — nothing listens on those
# endpoints here, so they are dead options in every datasource picker and a
# plausible way to build a panel that silently queries nothing. They are not
# provisioned by any file, so deleteDatasources is the only declarative way to
# remove them; listing them here also keeps them from coming back.
monitoring_grafana_absent_datasources:
  - opentsdb
  - graphite
  - influxdb

# Filename for the delete-only provisioning file. Named so it is obvious in a
# directory listing that it creates nothing; Grafana applies every file's
# deletes before any file's creates, so the name does not affect ordering.
monitoring_grafana_absent_file: zz-absent.yaml
