---
# noc — hyrule-mcp / xo-mcp tool servers + hyrule-prober.
# noc-agent is RETIRED: operators watch Icinga/Prometheus directly; the
# noc playbook only keeps the old noc-agent units stopped and removed.
#
# noc-agent (FastAPI on :8000) receives webhooks from Alertmanager and Icinga2
# on mon, runs an LLM-driven investigation against hyrule-mcp tools, and
# notifies a Discord channel. hyrule-mcp is a stdio child of noc-agent.

hyrule_mcp_version: b201978d6474112f46095b37bb4b35e13855fd50

# hyrule-prober — AS215932 looking-glass backing Hyrule Cloud /v1/path/* (ping +
# traceroute). Apply is gated (hyrule_prober_apply); go-live also needs
# prober_token in kv/hyrule-cloud so the api VM authenticates. See
# hyrule-cloud/docs/runbooks/prober-deploy.md.
hyrule_prober_version: 1e2fc5495ec470dc5eacc80b0ac35f3edf49ab1d

# Model chain: Hunyuan 3 primary ($0.14/$0.58 per Mtok, frontier-level) with
# DeepSeek V4 Flash as fallback; venice:deepseek-v4-flash keeps the chain
# provider-redundant (issue #393 — a single OpenRouter key cap must not take
# triage down; Venice does not host Hunyuan). venice: entries require
# noc-agent >= a7f0432 (venice provider) and venice_api_key in kv/noc-agent.
noc_agent_model: "openrouter:tencent/hy3"
noc_agent_fallback_models: "openrouter:deepseek/deepseek-v4-flash,venice:deepseek-v4-flash"

# Keep local CaseService verification and knowledge context. Engineering Loop
# handoffs and collector emissions are disabled because the loop VM is retired.
# The existing disk condition remains an active incident, without suppression.
noc_lhp_enabled: true
noc_engineering_handoff_delivery_enabled: false
noc_knowledge_context_enabled: true
noc_case_verification_enabled: true
noc_case_verification_dry_run: false
noc_case_auto_resolve_enabled: false
noc_disk_alert_handoff_enabled: false
noc_lhp_disk_alert_fingerprint: 8fb421ff94bb1285
noc_agent_core_trace_enabled: false
noc_agent_core_trace_collector_url: ""

# XO MCP occasionally takes >5s to answer tools/list via supergateway during
# streamable-HTTP session churn. Keep Icinga + app health probes below their
# 15s HTTP wrapper timeout while avoiding false 5s flaps.
noc_agent_mcp_health_timeout_seconds: 12

firewall_extra_rules:
  # hyrule-prober (:8460): x402-gated path probes from the api VM; liveness
  # check from Icinga on mon.
  - { proto: tcp, dport: 8460, src: "{{ peers.api.ipv6 }}", comment: "hyrule-cloud API to hyrule-prober (path probes)" }
  - { proto: tcp, dport: 8460, src: "{{ peers.mon.ipv6 }}", comment: "Icinga /healthz check for hyrule-prober" }

  # Monitoring scrapes.
  - { proto: tcp, dport: 9100, src: "{{ peers.mon.ipv6 }}", comment: "node_exporter scrape" }

# Monitoring — register on mon (new host, not in legacy infra-vms.conf).
monitoring_register: true
monitoring_role: noc
monitoring_check_vars:
  # Vault Agent secret delivery — see configs/mon/icinga2/services/vault-agent.conf.
  # noc-agent already uses the durable (persisted SecretID) shape via
  # VAULT_NOC_AGENT_SECRET_ID in noc.yml.
  vault_agents:
    - noc-agent
monitoring_extra_services:
  - name: hyrule-prober-health
    check_command: http
    interval: 1m
    retry: 30s
    notes: "hyrule-prober liveness (AS215932 path-probe backend for Hyrule Cloud /v1/path/*)"
    vars:
      http_address: "{{ peers.noc.ipv6 }}"
      http_port: 8460
      http_uri: "/healthz"
      http_ipv6: true
      http_timeout: 10
      http_expect_body_regex: '"status":"live"'

# --- Logs --- (ships journald to log VM via Vector)
logs_register: true
logs_role: noc

# --- Structured flow metadata (read by scripts/render-network-flows.py) ---
host_meta:
  os: "Debian 13"
  role: "hyrule-mcp + xo-mcp + hyrule-prober (:8460); noc-agent retired"
  summary: "Autonomous NOC triage agent (FastAPI :8000) running LLM investigations against hyrule-mcp tools (a stdio child), plus the hyrule-prober sidecar (:8460) for Hyrule Cloud /v1/path/* probes."
network_flows_outbound:
  - { to: all-infra, proto: tcp, port: 22, purpose: "hyrule-mcp SSH to every infra host" }
  - { to: mon, proto: tcp, port: 9090, purpose: "Prometheus query API" }
  - { to: mon, proto: tcp, port: 5665, purpose: "Icinga2 REST API" }
  - { to: hyrule-cloud, proto: tcp, port: 443, purpose: "BGP snapshot ingest (cloud.hyrule.host)" }
  - { to: public, proto: tcp, port: 443, purpose: "LLM API, Discord webhook, and npx package install" }
  - { to: public, proto: "icmp+udp", purpose: "hyrule-prober ping/traceroute to probe targets (AS215932 vantage)" }
