---
# Prevent disposable APT binary metadata from consuming router disk headroom.
# Normal workflow: apply.yml, playbook=rtr-apt-cache, limit=rtr.
- name: Configure router APT binary cache policy
  hosts: rtr
  gather_facts: false
  become: true
  vars:
    rtr_apt_cache_config: |
      // Save router disk space; package lists and archives remain managed by APT.
      Dir::Cache::pkgcache "";
      Dir::Cache::srcpkgcache "";
  tasks:
    - name: Prepare controller artifact directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../generated/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      tags: [validate]

    - name: Render router APT cache policy for review
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../generated/{{ inventory_hostname }}/99-router-binary-cache"
        content: "{{ rtr_apt_cache_config }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      tags: [validate]

    - name: Disable persistent binary metadata caches on the small router disk
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-router-binary-cache
        owner: root
        group: root
        mode: "0644"
        content: "{{ rtr_apt_cache_config }}"
      when: rtr_apt_cache_apply | default(false) | bool
      tags: [apply]
