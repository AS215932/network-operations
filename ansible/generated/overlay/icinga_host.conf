// /etc/icinga2/conf.d/hosts/ansible/overlay.conf
// Managed by ansible/roles/monitoring — do not edit by hand.
// Source of truth: ansible/inventory/host_vars/overlay.yml

object Host "overlay" {
  address6 = "2a0c:b641:b50:2::71"
  display_name = "overlay (Tor relay / i2pd / Yggdrasil)"

  check_command = "ping6"

  vars.os = "Debian"
  vars.role = "overlay"
  vars.ssh_port = 22

  vars.prom_instance_node = "[2a0c:b641:b50:2::71]:9100"

  vars.disks["disk /"] = { mountpoint = "/" }
}

object Service "i2pd-unit" {
  host_name = "overlay"
  check_command = "prom_systemd_unit"
  check_interval = 2m
  retry_interval = 1m
  notes = "i2pd router is active"
  vars.prom_instance = "[2a0c:b641:b50:2::71]:9100"
  vars.systemd_unit = "i2pd.service"
}

object Service "yggdrasil-unit" {
  host_name = "overlay"
  check_command = "prom_systemd_unit"
  check_interval = 2m
  retry_interval = 1m
  notes = "Yggdrasil node is active"
  vars.prom_instance = "[2a0c:b641:b50:2::71]:9100"
  vars.systemd_unit = "yggdrasil.service"
}

object Service "i2pd-ntcp2" {
  host_name = "overlay"
  check_command = "tcp"
  check_interval = 5m
  retry_interval = 30s
  notes = "i2pd NTCP2 listener on tcp/24316 (IPv6)"
  vars.tcp_address = "2a0c:b641:b50:2::71"
  vars.tcp_port = 24316
}

