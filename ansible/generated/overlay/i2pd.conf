# /etc/i2pd/i2pd.conf — overlay — managed by ansible (roles/overlay)
# Generated: do not edit by hand.
#
# Plain transit router: no client proxies (HTTP/SOCKS/SAM/BOB/I2CP) exposed.
# IPv6-only transports on a fixed port so the host firewall can allow exactly
# one port; IPv4 stays off (see overlay_i2pd_ipv4 in roles/overlay/defaults).

log = syslog
loglevel = warn

ipv4 = false
ipv6 = true
address6 = 2a0c:b641:b50:2::71
port = 24316
# Public GUA, not behind NAT.
nat = false

bandwidth = 2048
share = 50
notransit = false
floodfill = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

# Router console, loopback only (ssh -L for diagnostics).
[http]
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
enabled = false

[socksproxy]
enabled = false

[sam]
enabled = false

[bob]
enabled = false

[i2cp]
enabled = false

[i2pcontrol]
enabled = false

[upnp]
enabled = false

[reseed]
verify = true
