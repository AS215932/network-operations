# /etc/pf.conf — managed by ansible (roles/firewall) — host rtr-bsd

# --- Interfaces ---
ext_if="xnf3"

# --- Our networks ---
table <AS215932> const { 2a0c:b641:b50::/44 }

# --- Bogons ---
table <bogons4> persist file "/etc/pf.bogons4"
table <bogons6> persist file "/etc/pf.bogons6"

# --- Options ---
set skip on lo
set loginterface $ext_if

# --- Normalization ---
match all scrub(random-id max-mss 1360)

# --- Default policy ---
block return in log all
block return out log all

# --- Bogons drop ---
block drop in quick log on $ext_if inet from <bogons4>
block drop out quick log on $ext_if inet to <bogons4>
block drop in quick log on $ext_if inet6 from <bogons6>
block drop out quick log on $ext_if inet6 to <bogons6>

# --- WireGuard mesh transit (asymmetric routing — no state) ---
pass quick on wg all no state

# --- AS215932 transit ---
pass in quick on $ext_if inet6 from any to <AS215932> no state
pass out quick on $ext_if inet6 from <AS215932> to any no state

# --- WireGuard underlay ports ---
pass in quick on $ext_if inet  proto udp from any to any port { 1343, 1344, 1345 } keep state label "WG_RULE: WireGuard underlay (v4)"
pass in quick on $ext_if inet6 proto udp from any to any port { 1343, 1344, 1345 } keep state label "WG_RULE: WireGuard underlay (v6)"

# --- SSH from ops-prefix ---
pass in quick on $ext_if inet  proto tcp from 77.166.211.126/32 to any port = ssh flags S/SA keep state label "USER_RULE: SSH from ops-prefix (v4)"
pass in quick on $ext_if inet6 proto tcp from 2a02:a442:1016::/48 to any port = ssh flags S/SA keep state label "USER_RULE: SSH from ops-prefix (v6)"

# --- ICMP ---
pass in quick inet  proto icmp keep state
pass in quick inet6 proto ipv6-icmp keep state

# --- Per-host service allows (firewall_extra_rules) ---
pass in quick on $ext_if inet6 proto tcp from 2a0c:b641:b50:2::50 to any port = 9100 keep state label "node_exporter scrape from mon"
pass in quick on $ext_if inet6 proto tcp from 2a0c:b641:b50:2::50 to any port = 9342 keep state label "frr_exporter scrape from mon"

# --- raw escape hatch ---
# iBGP from core loopbacks + rtr loopback (arrives over wg tunnels; the
# template's `pass quick on wg all no state` already covers forwarding, but
# explicit port-179 allows keep the audit trail and survive a future
# wg-pass lockdown — same rationale as the cr1 explicit scrape rules).
pass in quick on wg inet6 proto tcp from { 2a0c:b641:b50::a, 2a0c:b641:b50::b, \
    2a0c:b641:b50::c, 2a0c:b641:b50::d } to any port = bgp flags S/SA keep state \
    label "iBGP from mesh loopbacks"

# OSPFv3 on the WG mesh (proto 89, multicast + link-local).
pass in quick on wg inet6 proto ospf keep state label "OSPFv3 on WG mesh"

# DNS recursion — overlay VMs and customer VMs use rtr-bsd's Unbound during
# burn-in (point a test VM at ::2). No VRF split on OpenBSD: unbound binds
# the infra/vm addresses directly, so no underlay-source exception is needed
# (contrast rtr's VRF-confined unbound, issue #135).
pass in quick on xnf1 inet6 proto { tcp, udp } from { 2a0c:b641:b50:2::/64, 2a0c:b641:b51::/48, 2a0c:b641:b50:3::/64 } to any port = domain keep state label "DNS recursion from overlay (infra)"
pass in quick on xnf2 inet6 proto { tcp, udp } from { 2a0c:b641:b50:2::/64, 2a0c:b641:b51::/48, 2a0c:b641:b50:3::/64 } to any port = domain keep state label "DNS recursion from overlay (vm)"

# Monitoring scrapes + SSH from the overlay side (mon/noc/ci reach rtr-bsd
# over infra, not wan).
pass in quick on xnf1 inet6 proto tcp from 2a0c:b641:b50:2::50 to any port = 9100 flags S/SA keep state label "node_exporter scrape from mon (infra)"
pass in quick on xnf1 inet6 proto tcp from 2a0c:b641:b50:2::50 to any port = 9342 flags S/SA keep state label "frr_exporter scrape from mon (infra)"
pass in quick on xnf1 inet6 proto tcp from { 2a02:a442:1016::/48, 2a0c:b641:b50:3::/64, \
    2a0c:b641:b50:2::d0, 2a0c:b641:b50:2::a0, 2a0c:b641:b50:2::50 } to any port = ssh flags S/SA \
    keep state label "SSH from ops/VPN/ci/noc/mon (infra)"

# Customer VM isolation — destination-prefix enforced (not oifname), mirroring
# rtr's nftables isolation (customer_isolation_block_*). ci-pr
# (2a0c:b641:b51::c1) is the acceptance canary: ci-pr → mon:9100 must time
# out while DNS to ::2 and public egress still work.
block drop in quick log on xnf2 inet6 from 2a0c:b641:b51::/48 to { 2a0c:b641:b50:2::/64, 2a0c:b641:b50::/64, 2a0c:b641:b50:ff00::/56, 2a0c:b641:b50:1::/64 } label "customer→infra/router v6 isolation"

# Forwarding: router forwards between infra/vm/wg/wan. Default policy is
# block, so the forwarding path needs explicit passes (rtr's nftables uses
# forward policy accept; pf has no separate forward chain — filter rules
# cover forwarded packets).
pass in quick on xnf1 inet6 from 2a0c:b641:b50:2::/64 to any label "forward: infra egress"
pass in quick on xnf2 inet6 from 2a0c:b641:b51::/48 to any label "forward: customer egress (post-isolation)"
pass out quick on xnf1 inet6 from any to 2a0c:b641:b50:2::/64 label "forward: infra return"
pass out quick on xnf2 inet6 from any to 2a0c:b641:b51::/48 label "forward: customer return"
pass out quick on xnf3 inet6 from any to any label "forward: underlay egress"

# CUTOVER DELTA (Phase 2, not active): pf rdr/binat for the failover IPv4 +
# NAT64 af-to live here. Requires its own OVH failover IP per the #23 lesson
# (never share the router's egress IP with the translation pool). See
# docs/runbooks/rtr-bsd-build.md.


# --- Outbound ---
pass out quick on $ext_if inet  proto { tcp, udp, icmp } from any to any keep state
pass out quick on $ext_if inet6 proto { tcp, udp, ipv6-icmp } from any to any keep state
