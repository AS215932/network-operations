// /etc/icinga2/conf.d/hosts/ansible/netproxy.conf
// Managed by ansible/roles/monitoring — do not edit by hand.
// Source of truth: ansible/inventory/host_vars/netproxy.yml

object Host "netproxy" {
  address6 = "2a0c:b641:b50:2::e0"
  display_name = "netproxy (Hyrule network proxy + reverse-SSH tunnel)"

  check_command = "ping6"

  vars.os = "Debian"
  vars.role = "netproxy"
  vars.ssh_port = 22

  vars.prom_instance_node = "[2a0c:b641:b50:2::e0]:9100"

  vars.disks["disk /"] = { mountpoint = "/" }
}

object Service "tunnel-ssh-intake" {
  host_name = "netproxy"
  check_command = "tcp"
  check_interval = 2m
  retry_interval = 30s
  notes = "Public reverse-SSH tunnel intake on tcp/2222"
  vars.tcp_address = "2a0c:b641:b50:2::e0"
  vars.tcp_port = 2222
}

object Service "tunnel-metrics" {
  host_name = "netproxy"
  check_command = "tcp"
  check_interval = 5m
  retry_interval = 30s
  notes = "hyrule-tunnel-proxy metrics/health listener on tcp/8453 (mon-reachable)"
  vars.tcp_address = "2a0c:b641:b50:2::e0"
  vars.tcp_port = 8453
}

