// /etc/icinga2/conf.d/hosts/ansible/noc.conf
// Managed by ansible/roles/monitoring — do not edit by hand.
// Source of truth: ansible/inventory/host_vars/noc.yml

object Host "noc" {
  address6 = "2a0c:b641:b50:2::a0"
  display_name = "noc"

  check_command = "ping6"

  vars.os = "Debian"
  vars.role = "noc"
  vars.ssh_port = 22
  vars.vault_agents = ["noc-agent"]

  vars.prom_instance_node = "[2a0c:b641:b50:2::a0]:9100"

  vars.disks["disk /"] = { mountpoint = "/" }
}

object Service "hyrule-prober-health" {
  host_name = "noc"
  check_command = "http"
  check_interval = 1m
  retry_interval = 30s
  notes = "hyrule-prober liveness (AS215932 path-probe backend for Hyrule Cloud /v1/path/*)"
  vars.http_address = "2a0c:b641:b50:2::a0"
  vars.http_port = 8460
  vars.http_uri = "/healthz"
  vars.http_ipv6 = true
  vars.http_timeout = 10
  vars.http_expect_body_regex = "\"status\":\"live\""
}

