global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    # Critical alerts skip group_wait so they hit Discord faster.
    - matchers:
        - severity = "critical"
      receiver: discord
      group_wait: 10s

receivers:
  # An unconditional `webhook_url: ''` here previously crash-looped
  # Alertmanager (0.28 rejects "unsupported scheme \"\" for URL" at load,
  # not just at send time), which is fatal in a discord_config since this is
  # the route's only receiver. Guarded exactly like the noc webhook below:
  # missing secret degrades to a receiver with zero configs (alerts route
  # here and are silently dropped) instead of taking the whole daemon down.
  - name: discord

inhibit_rules:
  # If a probe is critical, don't also fire the warn-level slow alert for
  # the same instance — would just spam.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [instance, job]
